[package]
name = "kcc721-engine"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
blake2b_simd = "1"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-consensus-client = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
silverscript-lang = { git = "https://github.com/kaspanet/silverscript.git", rev = "26e3b9f" }
secp256k1 = { version = "0.29", features = ["global-context"] }
